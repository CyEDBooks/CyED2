<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img">
<title>Árbol de factorización de 360, nivel 1</title>
<rect width="620" height="400" fill="#ffffff"/>
<line x1="310.0" y1="68" x2="170.0" y2="108" stroke="#49636f" stroke-width="1.8"/>
<line x1="310.0" y1="68" x2="450.0" y2="108" stroke="#49636f" stroke-width="1.8"/>
<circle cx="310.0" cy="44" r="24" fill="#e5f5f9" stroke="#0b7189" stroke-width="2.2"/><text x="310.0" y="50" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="17" fill="#023047" text-anchor="middle" font-weight="bold">360</text>
<circle cx="170.0" cy="132" r="24" fill="#e5f5f9" stroke="#0b7189" stroke-width="2.2"/><text x="170.0" y="138" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="17" fill="#023047" text-anchor="middle" font-weight="bold">36</text>
<circle cx="450.0" cy="132" r="24" fill="#e5f5f9" stroke="#0b7189" stroke-width="2.2"/><text x="450.0" y="138" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="17" fill="#023047" text-anchor="middle" font-weight="bold">10</text>
<text x="310.0" y="384" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="15" fill="#0b7189" text-anchor="middle" font-weight="bold">360 = 36 · 10: ninguno de los dos es primo</text>
</svg>
